<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <meta name="description" content="Aahar Shudhi - Login">
    <meta name="theme-color" content="#2a5c3e">
    <title>Aahar Shudhi - Login</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <!-- Config -->
    <script src="js/config/constants.js"></script>
    <script src="js/config/firebase-config.js"></script>
    
    <!-- Auth Service -->
    <script src="js/services/auth-service.js"></script>
    
    <style>
        :root {
            --primary: #2a5c3e;
            --primary-light: #3d7a54;
            --primary-bg: #e3f0e5;
            --white: #ffffff;
            --bg-main: #f0f4f1;
            --text-dark: #1e3a2f;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --danger: #dc3545;
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.10);
            --shadow-xl: 0 12px 36px rgba(0,0,0,0.12);
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .login-container {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            position: relative;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .login-logo .icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
            animation: pulse 3s infinite;
        }
        
        .login-logo h1 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }
        
        .login-logo p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42,92,62,0.1);
            background: var(--white);
        }
        
        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        
        .btn-login:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-login:active {
            transform: scale(0.97);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .login-error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: none;
            animation: shake 0.5s ease;
        }
        
        .login-error.show {
            display: block;
        }
        
        .login-error.success {
            background: #d4edda;
            color: #155724;
        }
        
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 15px;
        }
        
        .forgot-password a {
            font-size: 0.75rem;
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .remember-me input {
            width: auto;
        }
        
        .remember-me label {
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo -->
        <div class="login-logo">
            <span class="icon">🌿</span>
            <h1>Aahar Shudhi</h1>
            <p>Lead Management System</p>
        </div>
        
        <!-- Error Message -->
        <div id="login-error" class="login-error"></div>
        
        <!-- Login Form -->
        <form id="login-form" autocomplete="off">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            
            <div class="forgot-password">
                <a onclick="handleForgotPassword()">Forgot password?</a>
            </div>
            
            <div class="remember-me">
                <input type="checkbox" id="remember-me" checked>
                <label for="remember-me">Remember me</label>
            </div>
            
            <button type="submit" class="btn-login" id="login-button">
                🔐 Sign In
            </button>
        </form>
        
        <!-- Help Text -->
        <p style="text-align: center; margin-top: 20px; font-size: 0.75rem; color: #6c757d;">
            Need access? Contact your administrator
        </p>
    </div>

    <script>
        // ============================================
        // CONSOLE WARNING SUPPRESSION
        // ============================================
        
        (function() {
            const originalWarn = console.warn;
            console.warn = function(...args) {
                if (args[0] && typeof args[0] === 'string' && (
                    args[0].includes('unload is not allowed') ||
                    args[0].includes('Permissions policy') ||
                    args[0].includes('frame.js') ||
                    args[0].includes('WebSocket')
                )) {
                    return;
                }
                originalWarn.apply(console, args);
            };
            
            const originalError = console.error;
            console.error = function(...args) {
                if (args[0] && typeof args[0] === 'string' && (
                    args[0].includes('Permissions policy') ||
                    args[0].includes('unload is not allowed')
                )) {
                    return;
                }
                originalError.apply(console, args);
            };
        })();
        
        // ============================================
        // LOGIN PAGE LOGIC
        // ============================================
        
        let isLoggingIn = false;
        
        // Show error
        function showError(message, type = 'error') {
            const errorElement = document.getElementById('login-error');
            errorElement.textContent = message;
            errorElement.className = 'login-error show';
            
            if (type === 'success') {
                errorElement.classList.add('success');
            }
            
            setTimeout(() => {
                errorElement.classList.remove('show');
            }, 5000);
        }
        
        // Update button
        function updateLoginButton(isLoading) {
            const button = document.getElementById('login-button');
            
            if (isLoading) {
                button.innerHTML = '<span class="spinner"></span> Signing in...';
                button.disabled = true;
            } else {
                button.innerHTML = '🔐 Sign In';
                button.disabled = false;
            }
        }
        
        // Handle login form submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isLoggingIn) return;
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;
            
            // Basic validation
            if (!email) {
                showError('Email is required');
                return;
            }
            
            if (!password) {
                showError('Password is required');
                return;
            }
            
            isLoggingIn = true;
            updateLoginButton(true);
            
            try {
                // Check if Firebase is loaded
                if (typeof firebase === 'undefined') {
                    throw new Error('Firebase not loaded');
                }
                
                // Check if auth is available
                if (typeof auth === 'undefined') {
                    throw new Error('Firebase Auth not initialized');
                }
                
                // Set persistence
                await auth.setPersistence(
                    rememberMe 
                        ? firebase.auth.Auth.Persistence.LOCAL 
                        : firebase.auth.Auth.Persistence.SESSION
                );
                
                // Sign in directly with Firebase Auth
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                console.log('✅ Login successful:', user.email);
                
                // Redirect to main app
                window.location.href = 'index.html';
                
            } catch (error) {
                console.error('❌ Login failed:', error);
                
                // Get friendly error message
                let errorMessage = 'An unexpected error occurred';
                
                if (error.code) {
                    const errorMap = {
                        'auth/invalid-email': 'Invalid email address',
                        'auth/user-disabled': 'This account has been disabled',
                        'auth/user-not-found': 'No account found with this email',
                        'auth/wrong-password': 'Incorrect password',
                        'auth/too-many-requests': 'Too many attempts. Please try later',
                        'auth/network-request-failed': 'Network error. Check your connection',
                        'auth/invalid-credential': 'Invalid email or password',
                        'auth/operation-not-allowed': 'Email/Password login is not enabled'
                    };
                    
                    errorMessage = errorMap[error.code] || error.message || errorMessage;
                }
                
                showError(errorMessage);
                isLoggingIn = false;
                updateLoginButton(false);
            }
        });
        
        // Handle forgot password
        async function handleForgotPassword() {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showError('Please enter your email first');
                return;
            }
            
            try {
                await auth.sendPasswordResetEmail(email);
                showError('Password reset email sent. Check your inbox.', 'success');
            } catch (error) {
                const errorMap = {
                    'auth/user-not-found': 'No account found with this email',
                    'auth/invalid-email': 'Invalid email address'
                };
                
                showError(errorMap[error.code] || 'Failed to send reset email');
            }
        }
        
        // Expose function globally
        window.handleForgotPassword = handleForgotPassword;
        
        // Check if already logged in
        if (typeof auth !== 'undefined') {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    console.log('👤 Already logged in, redirecting...');
                    window.location.href = 'index.html';
                }
            });
        }
        
        console.log('✅ Login Page Loaded');
    </script>
</body>
</html>
