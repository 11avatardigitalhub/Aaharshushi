<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <meta name="description" content="Aahar Shudhi - Login">
    <meta name="theme-color" content="#2a5c3e">
    <title>Aahar Shudhi - Login</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Config Files -->
    <script src="js/config/constants.js"></script>
    <script src="js/config/firebase-config.js"></script>
    
    <!-- Auth Service -->
    <script src="js/services/auth-service.js"></script>
    
    <style>
        :root {
            --primary: #2a5c3e;
            --primary-light: #3d7a54;
            --primary-dark: #1d4630;
            --primary-bg: #e3f0e5;
            --white: #ffffff;
            --bg-main: #f0f4f1;
            --text-dark: #1e3a2f;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --danger: #dc3545;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.10);
            --shadow-xl: 0 12px 36px rgba(0,0,0,0.12);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            --transition-base: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* Background decoration */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(42,92,62,0.05) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .login-container {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .login-logo .icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
            animation: pulse 3s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        
        .login-logo h1 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }
        
        .login-logo p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42,92,62,0.1);
            background: var(--white);
        }
        
        .form-group input::placeholder {
            color: #adb5bd;
        }
        
        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }
        
        .btn-login:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-login:active {
            transform: scale(0.97);
            box-shadow: var(--shadow-sm);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-google {
            width: 100%;
            padding: 12px;
            background: var(--white);
            color: var(--text-dark);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }
        
        .btn-google:hover {
            background: #f8f9fa;
            border-color: #adb5bd;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        
        .divider span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        .login-error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            margin-bottom: 15px;
            display: none;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .login-error.show {
            display: block;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 15px;
        }
        
        .forgot-password a {
            font-size: 0.75rem;
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .remember-me input {
            width: auto;
        }
        
        .remember-me label {
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        
        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                border-radius: var(--radius-lg);
            }
            
            .login-logo .icon {
                font-size: 3rem;
            }
            
            .login-logo h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo Section -->
        <div class="login-logo">
            <span class="icon">🌿</span>
            <h1>Aahar Shudhi</h1>
            <p>Lead Management System</p>
        </div>
        
        <!-- Error Message -->
        <div id="login-error" class="login-error"></div>
        
        <!-- Login Form -->
        <form id="login-form" autocomplete="off">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
            
            <div class="forgot-password">
                <a onclick="handleForgotPassword()">Forgot password?</a>
            </div>
            
            <div class="remember-me">
                <input type="checkbox" id="remember-me" checked>
                <label for="remember-me">Remember me</label>
            </div>
            
            <button type="submit" class="btn-login" id="login-button">
                🔐 Sign In
            </button>
        </form>
        
        <!-- Divider -->
        <div class="divider">
            <span>OR</span>
        </div>
        
        <!-- Google Login -->
        <button class="btn-google" onclick="handleGoogleLogin()">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            Continue with Google
        </button>
        
        <!-- Help Text -->
        <p style="text-align: center; margin-top: 20px; font-size: 0.75rem; color: #6c757d;">
            Need access? Contact your administrator
        </p>
    </div>

    <script>
        // ============================================
        // LOGIN PAGE SCRIPTS
        // ============================================
        
        let isLoggingIn = false;
        
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof FirebaseCore !== 'undefined') {
                const initialized = await FirebaseCore.initialize();
                
                if (initialized && FirebaseCore.isAuthenticated()) {
                    window.location.href = 'index.html';
                }
            }
        });
        
        // Handle login form submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isLoggingIn) return;
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;
            
            // Validate
            if (!email) {
                showError('Email is required');
                return;
            }
            
            if (!password) {
                showError('Password is required');
                return;
            }
            
            isLoggingIn = true;
            updateLoginButton(true);
            
            try {
                const result = await AuthService.loginUser(email, password, rememberMe);
                
                if (result.success) {
                    // Redirect to main app
                    window.location.href = 'index.html';
                } else {
                    showError(result.message || 'Login failed');
                    isLoggingIn = false;
                    updateLoginButton(false);
                }
            } catch (error) {
                showError('An unexpected error occurred');
                isLoggingIn = false;
                updateLoginButton(false);
            }
        });
        
        // Handle Google login
        async function handleGoogleLogin() {
            if (isLoggingIn) return;
            
            isLoggingIn = true;
            updateLoginButton(true, 'google');
            
            try {
                const result = await AuthService.loginWithGoogle();
                
                if (result.success) {
                    window.location.href = 'index.html';
                } else {
                    showError(result.message || 'Google login failed');
                    isLoggingIn = false;
                    updateLoginButton(false, 'google');
                }
            } catch (error) {
                showError('An unexpected error occurred');
                isLoggingIn = false;
                updateLoginButton(false, 'google');
            }
        }
        
        // Handle forgot password
        async function handleForgotPassword() {
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showError('Please enter your email first');
                return;
            }
            
            const result = await AuthService.sendPasswordReset(email);
            
            if (result.success) {
                showError('Password reset email sent. Check your inbox.', 'success');
            } else {
                showError(result.message || 'Failed to send reset email');
            }
        }
        
        // Show error message
        function showError(message, type = 'error') {
            const errorElement = document.getElementById('login-error');
            errorElement.textContent = message;
            errorElement.className = 'login-error show';
            
            if (type === 'success') {
                errorElement.style.background = '#d4edda';
                errorElement.style.color = '#155724';
            } else {
                errorElement.style.background = '#f8d7da';
                errorElement.style.color = '#721c24';
            }
            
            setTimeout(() => {
                errorElement.classList.remove('show');
            }, 5000);
        }
        
        // Update login button
        function updateLoginButton(isLoading, type = 'email') {
            const button = document.getElementById('login-button');
            
            if (type === 'email') {
                if (isLoading) {
                    button.innerHTML = '<span class="spinner"></span> Signing in...';
                    button.disabled = true;
                } else {
                    button.innerHTML = '🔐 Sign In';
                    button.disabled = false;
                }
            }
        }
        
        console.log('✅ Login Page Loaded');
    </script>
</body>
</html>
