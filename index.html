<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <meta name="description" content="Aahar Shudhi - Multi-Tenant Lead Management System">
    <meta name="theme-color" content="#2a5c3e">
    <title>Aahar Shudhi - Multi-Tenant Lead Management</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============ LOGIN SCREEN ============ -->
    <div id="login-screen">
        <div class="login-box">
            <span class="login-logo">🌿</span>
            <h1>Aahar Shudhi</h1>
            <p class="subtitle">Multi-Tenant Lead Management System</p>
            <div id="login-error"></div>
            <input type="email" id="login-email" placeholder="Email address" autocomplete="email">
            <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
            <button class="btn-login" id="login-btn" onclick="handleLogin()">🔐 Sign In</button>
            <p class="login-hint">Default Admin: admin@aahar.com / Admin@123</p>
        </div>
    </div>

    <!-- ============ DASHBOARD ============ -->
    <div id="dashboard">
        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="navbar-brand">
                <span>🌿</span> Aahar Shudhi
            </div>
            <div class="navbar-tenant" id="tenant-badge">🏢 Loading...</div>
            <div class="navbar-user" id="user-info"></div>
            <div class="navbar-actions">
                <button class="btn btn-primary" onclick="openLeadModal()">+ Add Lead</button>
                <button class="btn btn-danger" onclick="handleLogout()">🚪</button>
            </div>
        </nav>
        
        <!-- TABS -->
        <div class="tabs" id="main-tabs">
            <button class="tab-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</button>
            <button class="tab-btn" data-tab="kanban" onclick="switchTab('kanban')">📋 Kanban</button>
            <button class="tab-btn" data-tab="leads" onclick="switchTab('leads')">👥 Leads</button>
            <button class="tab-btn admin-only" data-tab="team" onclick="switchTab('team')">👥 Team</button>
            <button class="tab-btn admin-only" data-tab="tenants" onclick="switchTab('tenants')">🏢 Tenants</button>
            <button class="tab-btn admin-only" data-tab="settings" onclick="switchTab('settings')">⚙️ Settings</button>
        </div>
        
        <!-- TAB: DASHBOARD -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="metrics-bar" id="metrics-bar"></div>
        </div>
        
        <!-- TAB: KANBAN -->
        <div id="tab-kanban" class="tab-content">
            <div class="kanban-board" id="kanban-board"></div>
        </div>
        
        <!-- TAB: LEADS -->
        <div id="tab-leads" class="tab-content">
            <div class="table-container" id="leads-table-container"></div>
        </div>
        
        <!-- TAB: TEAM -->
        <div id="tab-team" class="tab-content">
            <div class="team-container" id="team-container"></div>
        </div>
        
        <!-- TAB: TENANTS -->
        <div id="tab-tenants" class="tab-content">
            <div class="table-container" id="tenants-container"></div>
        </div>
        
        <!-- TAB: SETTINGS -->
        <div id="tab-settings" class="tab-content">
            <div class="settings-container" id="settings-container"></div>
        </div>
    </div>

    <!-- ============ LEAD MODAL ============ -->
    <div class="modal-overlay" id="lead-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">🌿 Add New Lead</span>
                <button class="modal-close" onclick="closeLeadModal()">×</button>
            </div>
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="lead-name" placeholder="Customer full name">
            </div>
            <div class="form-group">
                <label>Phone Number <span class="required">*</span></label>
                <input type="tel" id="lead-phone" placeholder="10-digit mobile number">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="lead-email" placeholder="Email (optional)">
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="lead-city" placeholder="City">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Product</label>
                    <select id="lead-product">
                        <option value="">Select product</option>
                        <option>Chyawanprash</option>
                        <option>Ashwagandha</option>
                        <option>Triphala</option>
                        <option>Giloy Juice</option>
                        <option>Brahmi</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Source</label>
                    <select id="lead-source">
                        <option value="">Select source</option>
                        <option>Facebook</option>
                        <option>Instagram</option>
                        <option>Google Ads</option>
                        <option>Website</option>
                        <option>WhatsApp</option>
                        <option>Reference</option>
                        <option>Walk-in</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Priority</label>
                    <select id="lead-priority">
                        <option>Normal</option>
                        <option>Hot</option>
                        <option>Warm</option>
                        <option>Cold</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Assign To</label>
                    <select id="lead-assigned-to">
                        <option value="">Unassigned</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="lead-notes" rows="3" placeholder="Additional notes..."></textarea>
            </div>
            <div class="modal-actions">
                <button style="background:#f8f9fa;color:#495057;" onclick="closeLeadModal()">Cancel</button>
                <button style="background:#2a5c3e;color:white;" onclick="saveLead()">💾 Save Lead</button>
            </div>
        </div>
    </div>

    <!-- ============ TEAM MEMBER MODAL ============ -->
    <div class="modal-overlay" id="team-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">👥 Add Team Member</span>
                <button class="modal-close" onclick="closeTeamModal()">×</button>
            </div>
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="team-name" placeholder="Member name">
            </div>
            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="team-email" placeholder="Email address">
            </div>
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" id="team-password" placeholder="Temporary password">
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="team-phone" placeholder="Phone number">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Role</label>
                    <select id="team-role">
                        <option value="agent">Agent</option>
                        <option value="team_lead">Team Lead</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Team</label>
                    <select id="team-group">
                        <option value="North">North</option>
                        <option value="South">South</option>
                        <option value="East">East</option>
                        <option value="West">West</option>
                        <option value="All">All</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button style="background:#f8f9fa;color:#495057;" onclick="closeTeamModal()">Cancel</button>
                <button style="background:#2a5c3e;color:white;" onclick="saveTeamMember()">💾 Add Member</button>
            </div>
        </div>
    </div>

    <!-- ============ TENANT MODAL ============ -->
    <div class="modal-overlay" id="tenant-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">🏢 Create Tenant</span>
                <button class="modal-close" onclick="closeTenantModal()">×</button>
            </div>
            <div class="form-group">
                <label>Tenant Name <span class="required">*</span></label>
                <input type="text" id="tenant-name" placeholder="Company name">
            </div>
            <div class="form-group">
                <label>Plan</label>
                <select id="tenant-plan">
                    <option value="Free">Free</option>
                    <option value="Basic">Basic</option>
                    <option value="Premium">Premium</option>
                </select>
            </div>
            <div class="form-group">
                <label>Admin Email <span class="required">*</span></label>
                <input type="email" id="tenant-admin-email" placeholder="Tenant admin email">
            </div>
            <div class="form-group">
                <label>Admin Password <span class="required">*</span></label>
                <input type="password" id="tenant-admin-password" placeholder="Password">
            </div>
            <div class="modal-actions">
                <button style="background:#f8f9fa;color:#495057;" onclick="closeTenantModal()">Cancel</button>
                <button style="background:#2a5c3e;color:white;" onclick="saveTenant()">💾 Create Tenant</button>
            </div>
        </div>
    </div>

    <!-- ============ TOAST CONTAINER ============ -->
    <div id="toast-container"></div>

    <!-- JavaScript -->
    <script src="app.js"></script>
</body>
</html>
