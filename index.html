<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <meta name="description" content="Aahar Shudhi - Ayurvedic Lead Management System">
    <meta name="theme-color" content="#2a5c3e">
    <title>Aahar Shudhi - Lead Management System</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    
    <!-- Firebase SDK (MUST be first) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/kanban.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #f0f4f1;
            color: #1e3a2f;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f0f4f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
        }
        
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-logo {
            font-size: 4rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #2a5c3e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 20px;
        }
        
        .loading-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2a5c3e;
            margin-top: 15px;
        }
        
        .loading-subtitle {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-logo">🌿</div>
        <div class="loading-title">Aahar Shudhi</div>
        <div class="loading-subtitle">Lead Management System</div>
        <div class="loading-spinner"></div>
    </div>

    <!-- Main Container -->
    <div id="main-container"></div>

    <!-- Config Files (Order matters) -->
    <script src="js/config/constants.js"></script>
    <script src="js/config/firebase-config.js"></script>
    
    <!-- Services -->
    <script src="js/services/auth-service.js"></script>
    <script src="js/services/lead-service.js"></script>
    <script src="js/services/status-service.js"></script>
    <script src="js/services/kanban-service.js"></script>
    <script src="js/services/note-service.js"></script>
    <script src="js/services/followup-service.js"></script>
    <script src="js/services/dashboard-service.js"></script>
    <script src="js/services/realtime-service.js"></script>
    <script src="js/services/filter-service.js"></script>
    
    <!-- Components -->
    <script src="js/components/toast.js"></script>
    <script src="js/components/lead-card.js"></script>
    <script src="js/components/kanban-board.js"></script>
    <script src="js/components/lead-modal.js"></script>
    <script src="js/components/metrics-bar.js"></script>
    
    <!-- Main App -->
    <script src="js/app.js"></script>

    <script>
        // Hide loading screen when app is ready
        document.addEventListener('app-ready', () => {
            document.getElementById('loading-screen').classList.add('hidden');
        });
        
        // Fallback
        setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
        }, 10000);
    </script>
</body>
</html>
